# 采集知乎热榜任务
description: >
  搜索知乎热榜，抓取 Top 10 问题。对每个问题提取：
  标题、问题内容摘要、回答量、浏览量、关注数。
  使用搜索工具定位热榜页面，再提取结构化数据。
  问题内容摘要（summary）必须来自搜索结果或抓取页面的真实内容，
  用 1-3 句话概括问题背景，禁止编造；若确实无法获取，填 null。
  将结果以 JSON 数组形式输出，字段为：
  title, summary, answer_count, view_count, follower_count, url
expected_output: >
  一个包含 10 个问题的 JSON 数组，每条包含
  title, summary, answer_count, view_count, follower_count, url 字段。
agent: zhihu_collector
