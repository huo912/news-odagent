# 热度排序任务
description: >
  接收内容整合员输出的跨平台新闻池。
  综合多平台热度指标（阅读量/评论数/讨论量/时间衰减），
  使用 Python 代码执行 + 计算工具计算统一热度分。
  时间衰减：越新的新闻热度权重越高。
  筛选出全平台热度最高的 Top 3 新闻。
  注意：上游新闻池中的 summary（新闻内容摘要）字段必须原样保留，
  不得丢弃或置空，下游舆情分析依赖该字段。
expected_output: >
  一个包含 Top 3 新闻的 JSON 数组，每条包含统一热度分 heat_score 及
  platform, title, source, summary, publish_time, url 字段，
  并按热度分从高到低排序。
agent: heat_ranker
context:
  - integrate_content
