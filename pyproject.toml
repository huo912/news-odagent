[project]
name = "news-odagent"
version = "0.1.0"
description = "基于 CrewAI 的多 Agent 新闻采集、处理与推送团队"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai>=0.80.0",
    "crewai-tools>=0.20.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0",
    "textblob>=0.17.1",
]

[project.optional-dependencies]
# 启用 Nacos 远程模型配置时需要：pip install -e ".[nacos]"
nacos = ["nacos-sdk-python>=1.0.0"]
# 启用头条号 Playwright 自动发布时需要：
#   pip install -e ".[toutiao]" && playwright install chromium
#   首次使用先登录（扫码或手机号均可）：python -m news_crew.tools.toutiao_tool login
toutiao = ["playwright>=1.40.0"]
# 启用 kagent A2A 服务（方案 A：BYO Harness 部署）时需要。
# 注意 1：kagent-crewai 要求 Python >=3.11,<3.14，与本项目
#   requires-python (>=3.10,<3.13) 的交集为 3.11-3.12。
# 注意 2：kagent-core 声明 opentelemetry-api<1.39.0，与 crewai>=1.15
#   要求的 >=1.42 冲突（pip 无法解析）；且 otel instrumentation 生态
#   在 PyPI 只有 0.xxb0 预发布版本。因此不能直接 pip install 本组，
#   需按 README「kagent 部署」章节的步骤安装（--no-deps + --pre）。
kagent = [
    "kagent-crewai>=0.10.0",
    "uvicorn>=0.20.0",
    "fastapi>=0.100.0",
    "google-genai>=1.21.1",
    # otel base 包钉 1.42.1（kagent-core 实际需要 sdk._events，仅 1.42.x 有）
    "opentelemetry-api==1.42.1",
    "opentelemetry-sdk==1.42.1",
    "opentelemetry-exporter-otlp-proto-grpc==1.42.1",
    "opentelemetry-exporter-otlp-proto-http==1.42.1",
    "opentelemetry-proto==1.42.1",
    # instrumentation（PyPI 仅预发布，需 --pre）
    "opentelemetry-instrumentation-fastapi>=0.52.0",
    "opentelemetry-instrumentation-httpx>=0.52.0",
    "opentelemetry-instrumentation-asgi>=0.52.0",
    "opentelemetry-instrumentation>=0.52.0",
    "opentelemetry-semantic-conventions>=0.52.0",
    "opentelemetry-util-http>=0.52.0",
    "opentelemetry-instrumentation-openai>=0.52.5",
    "opentelemetry-instrumentation-anthropic>=0.52.5",
    "opentelemetry-instrumentation-google-generativeai>=0.52.5",
    "opentelemetry-instrumentation-crewai>=0.47.3",
    "opentelemetry-semantic-conventions-ai>=0.5.1",
]

[project.scripts]
news-crew = "news_crew.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
