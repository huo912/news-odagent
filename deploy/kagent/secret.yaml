# kagent BYO Harness 部署所需的环境变量 Secret
# 使用前替换为真实值：
#   kubectl apply -f secret.yaml
# 或用 --dry-run 生成后再编辑。生产环境建议用 sealed-secret / external-secrets
apiVersion: v1
kind: Secret
metadata:
  name: news-odagent-env
  namespace: kagent
type: Opaque
stringData:
  # LLM 网关（k8s 集群需可达）
  OPENAI_API_KEY: "sk-xxx"
  OPENAI_API_BASE: "http://10.105.1.5:4001/v1"
  OPENAI_MODEL_NAME: "moma_deepseek-v4-flash"
  # 搜索工具（可选）
  TAVILY_API_KEY: ""
  ANYSEARCH_API_KEY: ""
  # 微信公众号发布（头条号经「内容源同步」自动转载；需已认证公众号，
  # 且公众号后台 IP 白名单包含 Pod 出口 IP）
  WECHAT_APPID: ""
  WECHAT_SECRET: ""
  WECHAT_THUMB_MEDIA_ID: ""
  # Nacos 配置中心（远程模型热切换；k8s 集群需可达 10.170.25.245:8848）
  NACOS_SERVER_ADDR: "10.170.25.245:8848"
  NACOS_NAMESPACE: "news-oda"
  NACOS_GROUP: "DEFAULT_GROUP"
  NACOS_DATA_ID: "news-oda"
